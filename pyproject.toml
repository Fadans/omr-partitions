[project]
name = "omr"
version = "0.1.0"
description = "Analyse automatique de partitions musicales (OMR) — prototype Python"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
